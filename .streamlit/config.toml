# Shared theme options (both modes)
[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "8px"
showWidgetBorder = true

# Light mode (default). The sidebar "Dark mode" switch selects [theme.dark] instead.
[theme.light]
primaryColor = "#1d5bb8"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#eef3fa"
textColor = "#142033"
borderColor = "#dfe4ec"
dataframeHeaderBackgroundColor = "#eef3fa"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"

# Dark mode: deep navy surfaces, same identity; chart steps validated for the dark surface
[theme.dark]
primaryColor = "#5b9cf0"
backgroundColor = "#0f1520"
secondaryBackgroundColor = "#1c2635"
textColor = "#e6ebf2"
borderColor = "#2a3546"
dataframeHeaderBackgroundColor = "#1c2635"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#121a26"
secondaryBackgroundColor = "#1c2635"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
